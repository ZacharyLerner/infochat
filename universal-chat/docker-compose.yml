# Infochat universal-chat. Usage: create .env (see README.md), then docker compose up -d
# Locally, docker-compose.override.yml is merged in automatically (source mount + reload);
# in production use: docker compose -f docker-compose.yml up -d --build
services:
  chat:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Served at https://infochat.its.uri.edu/chat/ (path routing on the campus load balancer).
      - ROOT_PATH=/chat
    # No local state: chat settings live in S3 (store.py); attachments go to the docling Lambda.
    restart: unless-stopped
